version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: postgres-local
    restart: unless-stopped

    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-local
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redis:
    image: redis:7.2-alpine
    container_name: redis-local
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --save 60 1000

    volumes:
      - redis_data:/data

  api:
    build: .

    container_name: fastapi

    restart: unless-stopped

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    env_file:
      - .env

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  worker:
    build: .

    container_name: celery-worker

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    env_file:
      - .env

    command: >
      celery
      -A app.src.core.celery_app
      worker
      -l info

  beat:
    build: .
    container_name: celery-beat
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started

    env_file:
      - .env

    command: >
      celery
      -A app.src.core.celery_app
      beat
      -l info

  flower:
    image: mher/flower

    container_name: flower

    restart: unless-stopped

    command: >
      celery
      --broker=redis://redis:6379/0
      flower

    ports:
      - "5555:5555"

    depends_on:
      redis:
        condition: service_started

  # celery worker service

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
